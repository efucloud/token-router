# Token Router 本地配置模板。生产环境请通过部署系统注入真实凭据，勿提交密钥。
mysql:
    host: localhost:3306
    user: root
    password: EfuCloud
    dbname: token_router
    charset: utf8mb4
    loc: Local
    defaultStringSize: 255
    disableDatetimePrecision: false
    dontSupportRenameIndex: false
    dontSupportRenameColumn: false
    skipInitializeWithVersion: false
# 可选 Redis 路由缓存；删除或注释整个 redis 块即完全禁用。
# Redis 不可用时服务自动回退到数据库，不影响网关启动和请求处理。
# redis:
#     enabled: true
#     address: localhost:6379
#     username: ""
#     password: ""
#     db: 0
#     tls: false
#     keyPrefix: token-router
#     routeTTLSeconds: 30
#     dialTimeoutMillis: 1000
#     readTimeoutMillis: 500
#     writeTimeoutMillis: 500
#     poolSize: 0
logConfig:
    level: debug
    filename: ""
    maxsize: 10
    maxage: 30
    maxbackups: 10
    localtime: true
    compress: true
    production: false
oidcConfig:
    clientId: "umtsnwb4nvehzfmwaimi5knql"
    clientSecret: "boowj4iujtvqinyw5grtmqzvpblcc6v7jhpxke5zhiktxn6zw3u"
    issuer: "https://eauth.efucloud.com"
    # true 时接受同一 issuer 为其他 clientId 签发的 Token。
    skipClientIDCheck: true
gateway:
    upstreamTimeoutSeconds: 120
    maxAttempts: 3
    failureThreshold: 3
    cooldownSeconds: 60
    maxRequestBodyBytes: 16777216
    maxResponseBodyBytes: 33554432
    maxReservedTokens: 131072
chat:
    contextWindowTokens: 32768
    compactThreshold: 0.75
    compactKeepRecent: 8
    maxRetries: 3
    retryBaseMillis: 800
    retryMaxMillis: 8000
    # 进程内置文件与命令工具。command 拥有服务进程在容器内的权限；生产环境必须结合
    # 非 root、只读根文件系统、专用工作目录和最小化 ServiceAccount/RBAC 使用。
    builtinTools:
        enabled: true
        defaultEnabled: true
        # 留空或删除时，默认在进程运行目录创建 workspace；容器配置建议设为 /efucloud/workspaces。
        workspaceDirectory: workspace
        commandEnabled: true
        commandTimeoutSeconds: 120
        maxOutputBytes: 1048576
        maxUploadBytes: 33554432
    # 仅扫描服务端明确允许的目录；目录中的 SKILL.md 会发布到对话窗口。
    # 容器配置建议设为 ["/efucloud/skills"]。
    skillDirectories: []
    # MCP 凭据、请求头和命令仅保留在服务端配置中，不会返回浏览器。
    # streamable-http 示例:
    # - name: workspace
    #   type: streamable-http
    #   enabled: true
    #   url: http://mcp-server:3000/mcp
    #   headers: {Authorization: "Bearer replace-me"}
    # stdio 还可配置绝对 command、args、绝对 workingDir 与 environment。
    # 容器部署也直接在主配置文件中填写此列表。
    mcpServers: []
adminEmails:
  - admin@efucloud.com
