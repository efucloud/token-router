services:
  token-router:
    image: ghcr.io/efucloud/token-router:latest
    restart: unless-stopped
    ports:
      - "9006:9006"
    volumes:
      - ./config.yaml:/efucloud/config/config.yaml:ro
      - ./skills:/efucloud/skills:ro
      - ./mcp:/efucloud/mcp:ro
      - token-router-cache:/efucloud/.cache
      - token-router-home:/efucloud/.home
      - token-router-workspace:/efucloud/workspaces
    security_opt:
      - no-new-privileges:true

volumes:
  token-router-cache:
  token-router-home:
  token-router-workspace:
