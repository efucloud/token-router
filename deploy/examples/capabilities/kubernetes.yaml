apiVersion: v1
kind: Secret
metadata:
  name: token-router-config
type: Opaque
stringData:
  # 示例值必须在部署前替换；后端不会用环境变量覆盖此文件。
  config.yaml: |
    mysql:
      host: mysql:3306
      user: token_router
      password: replace-me
      dbname: token_router
    logConfig:
      level: info
      filename: ""
      production: true
    oidcConfig:
      issuer: https://identity.example.com
      clientId: token-router
      clientSecret: replace-me
      skipClientIDCheck: false
    chat:
      skillDirectories: [/efucloud/skills]
      builtinTools:
        enabled: true
        defaultEnabled: true
        workspaceDirectory: /efucloud/workspaces
        commandEnabled: false
      mcpServers:
        - name: knowledge
          type: streamable-http
          enabled: true
          url: http://knowledge-mcp:3000/mcp
          timeoutSeconds: 30
    adminEmails: [platform-admin@example.com]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-router-skills
data:
  container-operations.SKILL.md: |
    ---
    name: container-operations
    description: Follow the production container operations runbook
    ---

    Prefer read-only diagnostics and include the workload name in every result.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-router
  template:
    metadata:
      labels:
        app: token-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: token-router
          image: ghcr.io/efucloud/token-router:latest
          ports:
            - name: http
              containerPort: 9006
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          volumeMounts:
            - name: main-config
              mountPath: /efucloud/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: skills
              mountPath: /efucloud/skills/container-operations/SKILL.md
              subPath: container-operations.SKILL.md
              readOnly: true
            - name: mcp-programs
              mountPath: /efucloud/mcp
              readOnly: true
            - name: cache
              mountPath: /efucloud/.cache
            - name: home
              mountPath: /efucloud/.home
            - name: workspace
              mountPath: /efucloud/workspaces
            - name: log
              mountPath: /efucloud/log
      volumes:
        # token-router-config 必须提供包含所有运行配置和凭据的 config.yaml。
        - name: main-config
          secret:
            secretName: token-router-config
        - name: skills
          configMap:
            name: token-router-skills
        # stdio MCP 使用；只用 HTTP MCP 时可删除此卷和对应挂载。
        - name: mcp-programs
          persistentVolumeClaim:
            claimName: token-router-mcp-programs
        - name: cache
          emptyDir: {}
        - name: home
          emptyDir: {}
        # 个人工作区必须使用持久卷，确保 Pod 重建后用户文件仍存在。
        - name: workspace
          persistentVolumeClaim:
            claimName: token-router-workspaces
        - name: log
          emptyDir: {}
